samplesheet: "config/samples.tsv"
get_fastq:
  PE: true
  tool: "local"
  fastq_dump:
    extra: "-X 100000"
  fasterq_dump:
    extra: ""
trimming:
  tool: "cutadapt"
  fastp:
    extra: ""
  fastplong:
    extra: ""
  cutadapt:
    adapters: "-a TGGAATTCTCGGGTGCCAAGG -A GATCGTCGGACTGTAGAACTCTGAAC"
    extra: ""
umi_extraction:
  enabled: true  # Set to true to enable UMI extraction
  tool: "umi_tools"
  umi_tools:
    extra: "--bc-pattern=NNNNNNNN --bc-pattern2=NNNNNNNN"
qc:
  multiqc:
    extra: "--verbose --dirs"
  fastqc:
    extra: "--quiet"
