$schema: "https://json-schema.org/draft/2020-12/schema"
description: configuration file for the analysis pipeline
properties:
  samplesheet:
    type: string
    description: path to the sample sheet in tsv format

  trimming:
    type: object
    properties:
      tool:
        type: string
        description: processing tool to use, one of 'fastp' or 'fastplong'
        default: fastp
      fastp:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to fastp
      fastplong:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to fastplong
    required:
      - tool

  umi_extraction:
    type: object
    properties:
      enabled:
        type: boolean
        description: whether to enable UMI extraction
        default: false
      tool:
        type: string
        description: UMI extraction tool to use, one of 'umi_tools'
        default: umi_tools
      umi_tools:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to umi_tools extract
    required:
      - enabled

  qc:
    type: object
    properties:
      multiqc:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to MultiQC
      fastqc:
        type: object
        properties:
          extra:
            type: string
            description: additional arguments to pass to FastQC
    required:
      - multiqc
      - fastqc

required:
  - samplesheet
  - trimming
  - qc